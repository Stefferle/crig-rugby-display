# Corrections manuelles d'un match à venir : date/heure et/ou inversion.
#
# À utiliser quand coeurdurugby.com n'a pas (encore) répercuté un changement
# de programmation (ex: match avancé au samedi soir, ou match inversé : joué
# chez le club qui devait se déplacer). Une entrée par match à corriger.
# Pris en compte au prochain scrape ET au prochain `generate` (pas besoin de
# redémarrer le service) ; à retirer une fois que le site est à jour.
#
# - slug : la catégorie concernée (même valeur que dans config.yaml)
# - home_team / away_team : noms EXACTS tels que scrapés sur coeurdurugby.com
#   (avant application de club_aliases), dans l'ordre domicile/extérieur
#   d'origine du site — celui-ci ne change pas même si la date change, ni
#   même si le match est inversé (on indique l'ordre AVANT inversion)
# - date_label : la date corrigée, au même format que le site
#   (ex: "samedi 12 septembre 2026") ; à omettre si la date ne change pas
# - heure : l'heure corrigée (ex: "20:00") ; à omettre si elle ne change pas
# - inverser : true pour permuter domicile et extérieur (le match se joue
#   chez le club qui devait se déplacer) ; à omettre sinon
#
# Exemple (match F2 Villefranche-Illkirch inversé, joué à Illkirch, à 15:00) :
#
# overrides:
#   - slug: f2
#     home_team: "Villefranche Sur Saone"
#     away_team: "Illkirch Graffenstaden"
#     heure: "15:00"
#     inverser: true
#
# Exemple (match F2 Villefranche-Illkirch avancé au samedi soir) :
#
# overrides:

overrides:
   - slug: fb
     home_team: "Illkirch Graffenstaden"
     away_team: "Andrezieux Bouthéon"
     date_label: "dimanche 11 octobre 2026"
     heure: "13:00"

   - slug: f2
     home_team: "Illkirch Graffenstaden"
     away_team: "Andrezieux Bouthéon"
     date_label: "dimanche 11 octobre 2026"
     heure: "14:45"

   - slug: fb
     home_team: "Illkirch Graffenstaden"
     away_team: "Rillieux La Pape"
     date_label: "samedi 24 octobre 2026"
     heure: "18:30"

   - slug: f2
     home_team: "Illkirch Graffenstaden"
     away_team: "Rillieux La Pape"
     date_label: "samedi 24 octobre 2026"
     heure: "20:00"

   - slug: fb
     home_team: "Saint Claude"
     away_team: "Illkirch Graffenstaden"
     date_label: "samedi 7 novembre 2026"
     heure: "14:15"

   - slug: f2
     home_team: "Saint Claude"
     away_team: "Illkirch Graffenstaden"
     date_label: "samedi 7 novembre 2026"
     heure: "16:00"

   # aller et retour inversés : aller (15/11/2026) joué à Saverne,
   # retour (07/03/2027) joué à Illkirch
   - slug: r3
     home_team: "Illkirch Graffenstaden"
     away_team: "Saverne"
     inverser: true

   - slug: r3
     home_team: "Saverne"
     away_team: "Illkirch Graffenstaden"
     inverser: true


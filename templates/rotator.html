<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>CRIG Rugby — Résultats</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #141414; }
  iframe { border: none; width: 100vw; height: 100vh; display: block; }
</style>
</head>
<body>
<iframe id="rotator-frame" src="/{{ pages[0] }}.html"></iframe>
<script>
  const pages = {{ pages | tojson }};
  const intervalMs = {{ rotation_seconds * 1000 }};
  let index = 0;
  const frame = document.getElementById('rotator-frame');
  setInterval(() => {
    index = (index + 1) % pages.length;
    frame.src = '/' + pages[index] + '.html';
  }, intervalMs);
</script>
</body>
</html>

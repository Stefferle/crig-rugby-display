<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>CRIG Rugby — {{ competition.label }}</title>
<meta http-equiv="refresh" content="1800">
<link rel="stylesheet" href="/static/css/theme.css">
</head>
<body>
<header class="page-header">
    <img class="club-logo" src="/static/img/logo-crig.png" alt="{{ team_name }}">
    <div class="header-titles">
        <span class="club-name">CRIG</span>
        <h1 class="category-title">{{ competition.label }}</h1>
    </div>
    <nav class="category-nav">
        {% for c in all_competitions %}
        <a href="/{{ c.slug }}.html" class="{{ 'active' if c.slug == competition.slug else '' }}">{{ c.slug|upper }}</a>
        {% endfor %}
    </nav>
</header>

<main class="page-content">
{% block content %}{% endblock %}
</main>

<footer class="page-footer">
    <span class="credit">Données : coeurdurugby.com</span>
    {% if data.error %}
    <span class="status-badge status-stale">Données non rafraîchies — {{ data.error }}</span>
    {% endif %}
    <span class="updated-at">Dernière mise à jour : {{ updated_at_display }}</span>
</footer>
</body>
</html>

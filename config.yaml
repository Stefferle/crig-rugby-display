# Configuration du générateur de pages résultats rugby CRIG.
# Nom exact tel qu'il apparaît sur coeurdurugby.com, utilisé pour repérer
# la ligne du club dans les tableaux de classement et les pages d'équipe.
team_name: "Illkirch Graffenstaden"

# Corrections de noms de club à l'affichage uniquement (le scraping et la
# détection du club suivi utilisent toujours le nom exact ci-dessus / celui
# du site). Ne lister que les exceptions : tout club absent de cette liste
# s'affiche tel quel tel que trouvé sur coeurdurugby.com.
club_aliases:
  "Illkirch Graffenstaden": "CRIG"
  "Wolxheim": "Mutzig Ovalie Molsheim"  # erreur du site source (R3) : le club s'appelle en réalité Mutzig Ovalie Molsheim
  "Selestat": "Sélestat"
  "Villefranche Sur Saone": "Villefranche-sur-Saône"
  "Lons Le Saunier": "Lons-le-Saunier"
  "Chalon sur Saône": "Chalon-sur-Saône"
  "Andrezieux Bouthéon": "Andrézieux-Bouthéon"
  "Saint Dié": "Saint-Dié"
  "Bourgoin Jallieu": "Bourgoin-Jallieu"
  "Grenoble UC - Saint Martin D'heres": "Grenoble UC - Saint Martin d'Hères"
  "Saint Jean De Bournay": "Saint-Jean-de-Bournay"
  "Rillieux La Pape": "Rillieux-la-Pape"
  "Saint Claude": "Saint-Claude"

# Une entrée par catégorie à afficher. "slug" sert de nom de fichier de sortie
# (ex: f2 -> output/f2.html) et doit rester stable (utilisé aussi dans le cache).
competitions:
  - slug: f2
    label: "Séniors M - Fédérale 2 - Poule 2"
    resultats_url: "https://coeurdurugby.com/competitions/federale-2/Qualification/resultats/poule-2"
  - slug: fb
    label: "Séniors M - Fédérale B - Poule 2"
    resultats_url: "https://coeurdurugby.com/competitions/federale-b/Qualification/resultats/poule-2"
  - slug: f1f
    label: "Séniors F - Fédérale 1 - Poule 1"
    resultats_url: "https://coeurdurugby.com/competitions/federale-1-feminine/Qualification/resultats/poule-1"
  - slug: r3
    label: "Séniors - Régionale 3 - Poule 2"
    resultats_url: "https://coeurdurugby.com/competitions/regionale-3-grand-est/Qualification/resultats/poule-2"
  - slug: u18
    label: "Juniors Nationaux U18 - Poule 2"
    resultats_url: "https://coeurdurugby.com/competitions/juniors-nationaux/Qualification/resultats/poule-2"

server:
  port: 8090
  # Durée d'affichage (secondes) de chaque catégorie sur la page rotative index.html
  rotation_seconds: 20

schedule:
  # Week-end : scrape toutes les `weekend_interval_minutes` minutes, entre ces
  # deux heures (bornes incluses)
  weekend_start: 10
  weekend_end: 20
  weekend_interval_minutes: 10
  # Semaine (lun-ven) : une seule fois par jour, à cette heure
  weekday_daily_hour: 7

scraping:
  request_timeout: 15
  # Pause entre deux requêtes HTTP successives, pour rester respectueux envers coeurdurugby.com
  request_delay_seconds: 1.0
